<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#1b2330;--mu:#5d6b7e;--ac:#2563eb;--ok:#15803d;--no:#b91c1c;--bd:#d9dee6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}

.ctl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.say{padding:8px 10px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;min-height:42px}
.say.bad{border-color:var(--no)}.say.good{border-color:var(--ok)}
#log{margin:6px 0 0;padding-left:20px;color:var(--mu);font-size:13px;max-height:120px;overflow:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cols h3{margin:0 0 4px;font-size:.95rem}.cols ul{margin:0;padding-left:18px}.p h3{color:var(--ok)}.n h3{color:var(--no)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left}td:first-child{font-weight:700;white-space:nowrap}
