<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Third-Party Connections &amp; IDaaS Simulator</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--tx:#1b2333;--mu:#5b6578;--ac:#2563eb;--ok:#15803d;--bad:#b91c1c;--bd:#d9dfeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#182033;--tx:#e8ecf5;--mu:#9aa6bd;--ac:#6ea0ff;--ok:#4ade80;--bad:#f87171;--bd:#2c3752}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:18px 16px 4px;max-width:960px;margin:auto}h1{font-size:21px;margin:0}header p{color:var(--mu);margin:4px 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:960px;margin:auto}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:960px;margin:auto;padding:8px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:0 0 6px}
svg{width:100%;height:auto;display:block}
.nd rect{fill:var(--card);stroke:var(--bd);stroke-width:2}.nd.hot rect{stroke:var(--ac);fill:color-mix(in srgb,var(--ac) 14%,var(--card))}
.nd text{fill:var(--tx);font-size:13px;text-anchor:middle}
.ln{stroke:var(--bd);stroke-width:2;stroke-dasharray:5 4}.ln.hot{stroke:var(--ac)}
#pk{fill:var(--ac);transition:transform .9s ease-in-out}.mg{fill:var(--ac);font-size:12px;text-anchor:middle;font-weight:600}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.ctl button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer}
.ctl button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.stp{border-left:4px solid var(--ac);padding:6px 10px;background:color-mix(in srgb,var(--ac) 8%,var(--card));border-radius:0 8px 8px 0;min-height:48px}
ol.sl{padding-left:20px;margin:8px 0}ol.sl li{color:var(--mu);cursor:pointer}ol.sl li.on{color:var(--tx);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pro h3{color:var(--ok)}.con h3{color:var(--bad)}ul{margin:0;padding-left:18px}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:14px;padding:2px 10px;margin:2px;font-size:13px}
.mx{display:grid;grid-template-columns:90px 1fr 1fr;gap:6px;font-size:13px}.mx div{padding:8px;border:1px solid var(--bd);border-radius:8px}
.mx .c{cursor:pointer;background:var(--card)}.mx .c.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
</style></head><body>
<header><h1>Third-Party Connections &amp; Outsourced Identity — Interactive Simulator</h1>
<p>Pick a topic, press ▶ Play or step through. Each step shows what happens, then pros, cons and real-world uses.</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const M={
api:{n:'API',full:'Application Programming Interface',
intro:'A set of rules and data formats that lets one application request services or data from another without rebuilding them.',
nodes:['Your e-commerce app','API (rules + endpoint)','Payment provider'],
steps:[[0,0,'Pay clicked','Customer clicks “Pay”. The app builds a request following the API’s documented format (usually JSON).'],
[0,1,'HTTPS + API key','The app sends the request to the API endpoint over an encrypted channel, with an API key/token.'],
[1,2,'Validate &amp; forward','The API checks the key, rate limits and format, then passes the call to the provider’s internal service.'],
[2,2,'Charge card','The provider processes the payment — you never built this logic yourself.'],
[2,1,'Result','The provider returns an outcome (approved / declined).'],
[1,0,'200 OK + JSON','The API replies in the agreed data format; the app shows “Order confirmed”.']],
pros:['Reuse external functions, no build from scratch','Fast integration, easy scaling','Standard, documented, language-neutral'],
cons:['Dependency on vendor uptime and pricing','Leaked/over-privileged API keys = breach','Vendor changes can break your app','Data leaves your control'],
apps:['Commercial: Stripe/PayPal payments, Google Maps, social-share buttons','Banking: Open Banking APIs (PSD2)','Defense/Gov: data-exchange APIs between agencies and coalition systems (e.g., NATO/DoD service APIs)','Healthcare: FHIR APIs for patient records']},
ext:{n:'Application Extensions',full:'Plugins / Add-ons',
intro:'Software components that add features to an existing application without changing its core code.',
nodes:['User','Host app (browser)','Extension (ad blocker)','Web page'],
steps:[[0,1,'Install','User picks an extension from the store.'],
[1,2,'Grant permissions','Host asks “read/change data on websites?” — the user approves; extension is loaded into the host.'],
[0,3,'Open page','User visits a site; the page loads inside the host.'],
[2,3,'Hook &amp; modify','Extension inspects the page through host APIs and blocks ads / fills passwords.'],
[3,0,'Customised view','User sees the tailored result. Core app code was never modified.']],
pros:['Flexible customisation per user/team','Core codebase untouched','Large ecosystem, quick feature delivery'],
cons:['Over-broad permissions can read all data','Malicious or abandoned extensions (supply-chain risk)','Updates may break compatibility','Hard to audit at scale'],
apps:['Commercial: Chrome/Firefox add-ons, Shopify apps, WordPress plugins, VS Code extensions','Enterprise: Salesforce AppExchange, Microsoft 365 add-ins','Defense/Gov: allow-listed, vetted browser extensions on managed networks']},
mid:{n:'Middleware',full:'Intermediary integration layer (e.g., ESB — Enterprise Service Bus)',
intro:'Software between systems that provides messaging, data transformation and protocol translation so mismatched systems can interoperate.',
nodes:['CRM','Middleware / ESB','ERP','Legacy system'],
steps:[[0,1,'New order (REST/JSON)','CRM sends an order event to the ESB — it does not need to know who consumes it.'],
[1,1,'Queue','Message queuing stores the message safely so nothing is lost if a target is busy.'],
[1,1,'Transform','Data transformation maps JSON fields to the formats ERP and legacy expect.'],
[1,2,'Deliver (SOAP/XML)','Protocol translation: ESB sends to ERP in its native protocol.'],
[1,3,'Deliver (flat file/MQ)','Same event reaches the legacy mainframe in its old format.'],
[2,0,'Ack via ESB','Confirmations flow back; business process continues automatically.']],
pros:['Connects heterogeneous and legacy systems','Hides protocol/format complexity','Reliable delivery, central monitoring, automation'],
cons:['Single point of failure / bottleneck','Complex and costly to design and maintain','Central place holding sensitive data in transit','Vendor lock-in'],
apps:['Commercial: banks linking core banking to mobile apps, retail order-to-cash (MuleSoft, IBM MQ, Kafka)','Healthcare: HL7 integration engines','Defense/Gov: linking legacy command/logistics systems with modern ones; air-traffic and customs data exchange','Telecom &amp; Energy: billing and grid-control integration']},
ida:{n:'Identity as a Service (IDaaS)',full:'Cloud-delivered identity management',
intro:'Gartner-style definition: a predominantly cloud-based service (multi-tenant or dedicated/hosted) giving identity management, provisioning, governance and administration — in three service groups: IGA, Access, Intelligence.',
nodes:['User','IDaaS provider','Cloud app (SaaS)','Customer admin'],
steps:[[3,1,'IGA: new hire','Identity Governance &amp; Administration: admin adds the user; privileges set by role.'],
[1,2,'IGA: provision','IDaaS provisions the account into cloud apps; later handles changes, password resets, de-provisioning.'],
[0,1,'Access: sign in','User authenticates once (SSO) — device and user are checked in real time (MFA possible).'],
[1,2,'Access: SAML / OAuth 2.0','Federated standards pass a signed assertion/token; the app authorises the user without a new password.'],
[2,1,'Intelligence: events','Apps and IDaaS log sign-ins and activity — this is “accounting” in AAA.'],
[1,3,'Intelligence: alerts','Monitoring, reports and alerts reach the administrator (e.g., impossible-travel login).']],
pros:['No identity hardware to run; fast rollout','SSO improves user experience and security','Central audit and compliance reporting','Scales with subscription'],
cons:['Provider breach affects all customers','Outage blocks everyone from every app','Vendors may be vague about security terms','Accountability stays with your leadership'],
apps:['Commercial: Okta, Microsoft Entra ID, Ping Identity, Auth0 for workforce &amp; customer login','Government: citizen portals, FedRAMP-authorised IDaaS for agencies','Defense: DoD cloud identity services (e.g., ICAM/CAC-based federation), coalition partner access','Education &amp; Health: campus-wide SSO, clinician access']}
};
const EXTRA='<div class="card"><h3>Other services that can be outsourced “as-a-service”</h3>'+['Risk management planning &amp; assessment','Security assessment &amp; testing','Incident response','BC/DR planning &amp; support','Identity management','Full access control (AAA)','IT configuration management','Audit &amp; compliance reporting'].map(x=>'<span class="chip">'+x+'</span>').join('')+'<p style="color:var(--mu);margin:8px 0 0">Delivery can be on-premises staff and systems, cloud-hosted remote management, or fly-in rapid-response teams.</p></div>';
const MX={
a:['In-house + On-premises','Your employees run systems in your own facility. Maximum control, maximum cost and effort.'],
b:['In-house + Cloud-hosted','Your employees administer systems hosted on a public/private/hybrid cloud. Control of people, shared infrastructure.'],
c:['Third party + On-premises','An outside firm (via SLA &amp; contract) manages hardware that sits at your site.'],
d:['Third party + Cloud-hosted','An outside firm runs everything in the cloud — this is typical IDaaS. Cheapest to start, most reliance on the vendor.']};
const GL=[['API','Application Programming Interface'],['ESB','Enterprise Service Bus'],['CRM','Customer Relationship Management'],['ERP','Enterprise Resource Planning'],['IDaaS','Identity as a Service'],['IAM','Identity and Access Management'],['IGA','Identity Governance and Administration'],['SSO','Single Sign-On'],['SAML','Security Assertion Markup Language'],['OAuth 2.0','Open Authorization 2.0 (delegated access framework)'],['AAA','Authentication, Authorization and Accounting'],['SLA','Service Level Agreement'],['MFA','Multi-Factor Authentication'],['JSON / XML','JavaScript Object Notation / Extensible Markup Language'],['SOAP / REST','Simple Object Access Protocol / Representational State Transfer'],['BC / DR','Business Continuity / Disaster Recovery'],['SaaS','Software as a Service'],['HL7 / FHIR','Health Level Seven / Fast Healthcare Interoperability Resources'],['FedRAMP','Federal Risk and Authorization Management Program'],['ICAM','Identity, Credential and Access Management']];
const nav=document.getElementById('nav'),app=document.getElementById('app');
const tabs=[...Object.keys(M),'out','gl'];const names={api:'1 · APIs',ext:'2 · Extensions',mid:'3 · Middleware',ida:'4 · IDaaS',out:'5 · Outsourcing models',gl:'6 · Full forms'};
tabs.forEach(k=>{const b=document.createElement('button');b.textContent=names[k];b.onclick=()=>show(k);b.id='t'+k;nav.appendChild(b)});
let timer,cur=0;
const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
function show(k){clearInterval(timer);tabs.forEach(t=>document.getElementById('t'+t).classList.toggle('on',t==k));
if(k=='gl'){app.innerHTML='<div class="card wrap"><h2>Terminology — full forms</h2><table>'+GL.map(r=>'<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>').join('')+'</table></div>';return}
if(k=='out'){app.innerHTML='<div class="card"><h2>Outsourcing considerations — two questions</h2><p>1) <b>Who employs</b> (hires/fires) the administrators doing IAM tasks? <i>In-house</i> = employees; <i>Third party</i> = SLA + contract.<br>2) <b>Where</b> are systems and AAA databases located? <i>On-premises</i> or <i>Cloud-hosted</i> (public/private/hybrid; hybrid is common). Click a cell:</p><div class="mx"><div></div><div><b>On-premises</b></div><div><b>Cloud-hosted</b></div><div><b>In-house</b></div><div class="c" data-k="a">A</div><div class="c" data-k="b">B</div><div><b>Third party</b></div><div class="c" data-k="c">C</div><div class="c on" data-k="d">D</div></div><div class="stp" id="mxo" style="margin-top:10px"></div><p style="color:var(--mu)"><b>Key rule:</b> final responsibility for performance and security always stays with the organization’s leadership, whichever cell you pick.</p></div>'+EXTRA;
const f=x=>{document.getElementById('mxo').innerHTML='<b>'+MX[x][0]+'</b> — '+MX[x][1]};f('d');
app.querySelectorAll('.c').forEach(c=>{const x=c.dataset.k;c.textContent=MX[x][0];c.onclick=()=>{app.querySelectorAll('.c').forEach(y=>y.classList.remove('on'));c.classList.add('on');f(x)}});return}
const m=M[k],n=m.nodes.length,W=700,sp=W/n,X=i=>sp*i+sp/2;
let s='<svg viewBox="0 0 700 190">';
m.nodes.forEach((_,i)=>{if(i<n-1)s+='<line class="ln" id="l'+i+'" x1="'+X(i)+'" y1="95" x2="'+X(i+1)+'" y2="95"/>'});
m.nodes.forEach((t,i)=>{s+='<g class="nd" id="n'+i+'"><rect x="'+(X(i)-sp/2+10)+'" y="65" width="'+(sp-20)+'" height="60" rx="10"/><text x="'+X(i)+'" y="99">'+t+'</text></g>'});
s+='<text class="mg" id="mg" x="350" y="40"></text><circle id="pk" r="9" cx="0" cy="0" style="transform:translate('+X(0)+'px,95px)"/></svg>';
app.innerHTML='<div class="card"><h2>'+m.n+' <small style="color:var(--mu);font-weight:400">— '+m.full+'</small></h2><p style="margin:0 0 6px">'+m.intro+'</p>'+s+
'<div class="ctl"><button id="pv">◀ Prev</button><button class="p" id="pl">▶ Play</button><button id="nx">Next ▶</button><button id="rs">↺ Reset</button></div><div class="stp" id="st"></div><ol class="sl" id="sl">'+m.steps.map((x,i)=>'<li data-i="'+i+'">'+x[2]+'</li>').join('')+'</ol></div>'+
'<div class="g"><div class="card pro"><h3>✔ Pros</h3>'+li(m.pros)+'</div><div class="card con"><h3>✖ Cons / risks</h3>'+li(m.cons)+'</div></div><div class="card"><h3>Where it works today</h3>'+li(m.apps)+'</div>'+(k=='ida'?EXTRA:'');
const go=i=>{cur=Math.max(0,Math.min(m.steps.length-1,i));const[a,b,g,d]=m.steps[cur];
m.nodes.forEach((_,j)=>document.getElementById('n'+j).classList.toggle('hot',j==a||j==b));
for(let j=0;j<n-1;j++)document.getElementById('l'+j).classList.toggle('hot',j>=Math.min(a,b)&&j<Math.max(a,b));
document.getElementById('pk').style.transform='translate('+X(b)+'px,95px)';
const mg=document.getElementById('mg');mg.setAttribute('x',(X(a)+X(b))/2);mg.innerHTML=g;
document.getElementById('st').innerHTML='<b>Step '+(cur+1)+'/'+m.steps.length+':</b> '+d;
document.querySelectorAll('#sl li').forEach((l,j)=>l.classList.toggle('on',j==cur))};
const stop=()=>{clearInterval(timer);timer=0;document.getElementById('pl').textContent='▶ Play'};
document.getElementById('pv').onclick=()=>{stop();go(cur-1)};document.getElementById('nx').onclick=()=>{stop();go(cur+1)};
document.getElementById('rs').onclick=()=>{stop();document.getElementById('pk').style.transform='translate('+X(0)+'px,95px)';go(0)};
document.getElementById('pl').onclick=()=>{if(timer){stop();return}document.getElementById('pl').textContent='❚❚ Pause';if(cur>=m.steps.length-1)go(0);timer=setInterval(()=>{if(cur>=m.steps.length-1){stop();return}go(cur+1)},2200)};
document.querySelectorAll('#sl li').forEach(l=>l.onclick=()=>{stop();go(+l.dataset.i)});go(0)}
show('api');
</script></body></html>
