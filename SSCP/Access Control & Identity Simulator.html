<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Access Control &amp; Identity Simulator</title>
<style>
:root{--bg:#eef2f5;--sf:#fff;--ink:#14212b;--mu:#566673;--ln:#cdd7de;--ac:#0e7c86;--ok:#2e8b57;--no:#c0392b;--am:#b7791f;--hi:#d9f0f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f171d;--sf:#18232b;--ink:#e6eef3;--mu:#97a8b4;--ln:#2c3a44;--ac:#4fc3cd;--ok:#5cc48a;--no:#ef7a6c;--am:#e3b25a;--hi:#16424a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1000px;margin:auto}h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em}header p{margin:0;color:var(--mu);max-width:62ch}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 20px;max-width:1000px;margin:auto}
nav button,.chip,.btn{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true],.chip[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--am);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:0 20px 48px}h2{margin:8px 0}h3{margin:22px 0 8px;font-size:1.05rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin:12px 0}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.node{padding:10px 12px;border:2px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--mu);transition:.3s;font-size:.92rem}
.node.on{border-color:var(--ac);background:var(--hi);color:var(--ink);transform:translateY(-3px)}
.arrow{color:var(--ln)}.step{margin:14px 0 10px;min-height:3.2em}.step b{color:var(--ac)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pro{border-left:4px solid var(--ok)}.con{border-left:4px solid var(--no)}.app{border-left:4px solid var(--ac)}
ul{margin:6px 0;padding-left:20px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{border:1px solid var(--ln);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--bg)}
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.box{border:2px solid var(--ln);border-radius:8px;padding:12px;text-align:center;background:var(--bg);color:var(--mu);transition:.3s;min-height:68px}
.box.on{border-color:var(--ac);background:var(--hi);color:var(--ink)}.box.rm{clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);border:0;background:var(--no);color:#fff;font-weight:600;display:grid;place-items:center}.box.rm.on{outline:0;filter:brightness(1.2)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.ctl label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mu)}select{font:inherit;padding:7px;border-radius:6px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
.msg{padding:10px;border-radius:8px;background:var(--bg);min-height:3em;margin:8px 0}.ok{color:var(--ok);font-weight:600}.no{color:var(--no);font-weight:600}
#log div{font-size:.88rem;border-bottom:1px solid var(--ln);padding:3px 0}code{background:var(--bg);padding:1px 5px;border-radius:4px;word-break:break-all}
input[type=search]{font:inherit;padding:8px;width:100%;max-width:340px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:560px){.sim{grid-template-columns:1fr}.box.rm{min-height:90px}}
</style></head><body>
<header><h1>Access Control &amp; Identity Simulator</h1><p>Step through how subjects, reference monitors, kernels, identity services and attacks work. Pick a topic, press Next or Auto-play.</p></header>
<nav id="nav" role="tablist"></nav><main id="main"></main>
<script>
const D={topics:[
{id:'ac',name:'Access control',title:'Access Control Fundamental Concepts',
intro:'Access control is the set of procedures that permit access to controlled areas and information according to policy. Every decision involves three elements: subjects, objects and rules.',
nodes:['Subject (active)','Request','Control layer (IAM)','Rule base / ACL','Object (passive)'],
steps:[
{n:[0],t:'A subject (user, process, program, device) decides it needs a service. Subjects are active and should carry a permission or clearance level (least privilege).'},
{n:[0,1],t:'The subject sends a request. An unknown subject with no permissions must be denied everything.'},
{n:[2],t:'Objects hold no access logic of their own, so a separate layer (IAM, OS, reference monitor) intercepts the request.'},
{n:[2,3],t:'The layer checks the rules the object’s owner recorded in the rule base or access control list.'},
{n:[2,4],t:'If permitted, the passive object responds to the request; otherwise it is never touched.'},
{n:[0,4],t:'Roles flip: a user clicking Delete is a subject; the file system receiving it is an object, but when it updates the disk directory it becomes a subject. Subject = seeking, object = sought.'}],
pros:['Enforces least privilege and a layered defence','Covers physical and logical assets (buildings, server rooms, networks, apps)','Owner-defined rules give clear accountability','Rules can be audited and reviewed'],
cons:['Stale permissions drift from current job duties','Large rule bases are hard to maintain','Failure or compromise of the control layer exposes everything','Objects cannot protect themselves'],
apps:{Commercial:'Banking apps, ERP roles, badge-controlled offices, cloud IAM policies',Defense:'Clearance levels and need-to-know on classified networks, secure facilities',Other:'Hospital records, university LMS and grade systems, smart buildings'}},
{id:'rm',name:'Reference monitor',custom:'rm',title:'Reference Monitor Concept',
intro:'An abstract machine that mediates every access by a subject to an object, using owner-defined rules, and logs every attempt. First described by James P. Anderson (1972, Computer Security Technology Planning Study). It must be small and simple. Try the simulation below.',
steps:[
{t:'Subject requests access to data on the server.'},{t:'Reference monitor intercepts the request (complete mediation).'},{t:'It checks the rule base written by the data owner.'},{t:'It decides: permit or deny.'},{t:'Permitted: subject reaches the object. Denied: object is untouched.'},{t:'The attempt, permitted or denied, is logged.'}],
props:[['Complete mediation','Every access to a protected resource is checked, with no bypass path.'],['Tamperproof','Immune to modification by subjects or attackers.'],['Verifiable','Small enough that its correctness can be proven.']],
pros:['Single enforcement point is easier to reason about','Complete audit trail','Policy separated from the objects','Provable security when kept small'],
cons:['Performance cost on every access','Only an abstract ideal; real systems approximate it','A bug or bypass voids all guarantees','Hard to keep minimal as features grow'],
apps:{Commercial:'Windows Security Reference Monitor, SELinux/AppArmor, cloud API authorisers',Defense:'High-assurance and multilevel secure systems, cross-domain guards',Other:'Banking mainframes (RACF), healthcare record systems'}},
{id:'sk',name:'TCB & security kernel',title:'TCB, Reference Monitor and Security Kernel',
intro:'The Trusted Computing Base (TCB) is everything that must be trusted to enforce policy. The security kernel is the practical implementation of the reference monitor inside the TCB, extending into hardware (TPM) and firmware (UEFI).',
nodes:['Hardware (TPM)','Firmware (UEFI/BIOS)','Secure boot','Security kernel','Reference monitor concept','Applications / users'],
steps:[
{n:[0],t:'Hardware such as the TPM provides cryptographic functions and secure key storage.'},
{n:[0,1],t:'Firmware (BIOS/UEFI) starts first and verifies what it loads.'},
{n:[1,2],t:'Secure boot ensures only trusted, verified software loads at startup.'},
{n:[3],t:'The security kernel starts and provides access control, audit and integrity (self-protection).'},
{n:[3,4],t:'The kernel implements the reference monitor: complete mediation, tamperproof, verifiable.'},
{n:[3,5],t:'All user and program requests pass through the kernel, which stays modular, isolated and fault tolerant.'}],
table:{head:['Platform','TCB','Reference monitor','Security kernel'],rows:[
['Windows','NT kernel, drivers, Secure Boot, TPM','Security Reference Monitor (ACLs, auditing)','DEP, ASLR, Credential Guard'],
['Apple','XNU kernel, Secure Enclave, T2 chip','Security Framework, sandbox, Gatekeeper','XNU, SIP, Gatekeeper'],
['Linux','Kernel, glibc, core services (systemd)','LSM framework: SELinux, AppArmor','LSM modules, capabilities'],
['Mainframe','z/OS kernel, zSeries CPUs, firmware','SAF with RACF','z/OS security kernel, crypto services']]},
pros:['Strong, hardware-rooted trust','Modularity, isolation, fault tolerance','Self-protecting integrity','Origins in Multics (Honeywell, 1970s)'],
cons:['Larger TCB means more attack surface','Needs trustworthy hardware and firmware','Costly to design, certify and update','Kernel flaws affect the whole system'],
apps:{Commercial:'Laptops and phones with TPM/Secure Enclave, cloud hypervisors, ATMs',Defense:'Trusted OS and hardened Linux (SELinux originated with NSA), avionics',Other:'IBM z/OS in banks and insurers, medical devices, IoT secure boot'}},
{id:'ida',name:'Identity as a Service',title:'Identity as a Service (IDaaS)',
intro:'A cloud subscription in which a third party provides IAM: single sign-on, provisioning and deprovisioning for cloud and on-premises systems. Gartner 2024 leaders listed: Ping Identity, Microsoft Entra ID, Okta.',
nodes:['User','Application (cloud or local)','IDaaS provider (IdP)','Directory & policies','Cloud service provider'],
steps:[
{n:[0,1],t:'User opens an application and is redirected to the IDaaS login.'},
{n:[2],t:'The provider authenticates the user (password, MFA) against its directory.'},
{n:[2,3],t:'It checks current role and access policies to decide permissions.'},
{n:[2,1],t:'It issues a signed token (SAML or OIDC) so the user gets single sign-on.'},
{n:[1,4],t:'The application trusts the token and serves data held by the CSP under agreed SLAs.'},
{n:[2,3],t:'On joiner, mover or leaver events the provider provisions or deprovisions accounts automatically.'}],
pros:['One login across many systems (SSO)','Lower infrastructure cost; vendor keeps it patched','Automated provisioning removes leftover access','Scales with cloud adoption'],
cons:['Depends on a third party: outage or compromise hits everyone','Needs SLAs and compliance assurance for data','Stale permissions still a risk if roles are not reviewed','Vendor lock-in'],
apps:{Commercial:'SaaS suites (Microsoft 365, Salesforce), retail and fintech workforce logins',Defense:'Government-cloud IAM, contractor federation (with accredited providers)',Other:'Universities (staff and student SSO), healthcare, e-government portals'}},
{id:'atk',name:'Authentication & authorization attacks',title:'Authentication and Authorization Vulnerabilities',custom:'atk',
intro:'The identification, authentication, authorization and accounting (IAAA) systems are the main battlefield. Select an attack to step through it; for IDOR, try the live demo.',
pros:['Why attacks work: design or config errors, trust assumptions, weak endpoint checks','Lists are ephemeral: new ones appear as old ones close'],
cons:['Defences: complete mediation, MFA, least privilege, server-side checks, signed firmware, time-synchronised logs'],
plabel:'Why they work',clabel:'Defences',
apps:{Commercial:'Web and mobile banking, e-commerce, SaaS APIs',Defense:'Insider and supply-chain threats, hotel and travel networks',Other:'Healthcare portals, university systems, IoT'},
items:[
{name:'Authentication bypass',nodes:['Attacker','Overlooked path','System'],steps:[
{n:[0],t:'Attacker looks for a way around the login: physical USB in a data centre, a router with flashable firmware, or an odd feature-activation sequence.'},
{n:[0,1],t:'Example: “AirBnB attack”, flashing an attacker-friendly firmware onto a rental or hotel router.'},
{n:[1,2],t:'The system trusts the path and never asks for authentication.'}],d:'Physical controls, signed firmware, no implicit trust of inside paths.'},
{name:'Forced authentication',nodes:['User','Attacker (MITM)','Target system'],steps:[
{n:[0,1],t:'Machine-in-the-middle intercepts the dialogue; spear phishing sends documents with links to the attacker’s server.'},
{n:[1,2],t:'The target is tricked into authenticating to the attacker, who captures credential hashes.'},
{n:[1],t:'Cracked hashes reveal valid identities for further access.'}],d:'Block outbound auth to unknown hosts, MFA, email filtering.'},
{name:'Authorization bypass / forced browsing',nodes:['Attacker','Guessed URL','Weak endpoint','Privileges'],steps:[
{n:[0,1],t:'Attacker overrides a URL the app generated (forced browsing).'},
{n:[1,2],t:'The endpoint is poorly defended and returns content.'},
{n:[2,3],t:'Weak privilege-escalation control opens the wider environment.'}],d:'Check authorization on every request, server side.'},
{name:'IDOR',nodes:['Attacker','Edited parameter','Server','Other user’s data'],steps:[
{n:[0],t:'Attacker sees ?accountId=1&admin=true in the URL.'},
{n:[0,1],t:'Changes it to accountId=2 to see what happens.'},
{n:[2,3],t:'Without an ownership check the server returns account 2 with no IAAA involvement.'}],d:'Verify the object belongs to the session user; use indirect references.'},
{name:'Direct API interaction',nodes:['Attacker','Crafted API call','API','Data'],steps:[
{n:[0,1],t:'Like IDOR but done at byte level against API parameters.'},
{n:[1,2],t:'Attacker experiments with values, IDs and fields.'},
{n:[2,3],t:'Lax server checks return or change data.'}],d:'Schema validation, per-object authorization, rate limits.'},
{name:'TOCTOU',nodes:['Check','Gap','Use'],steps:[
{n:[0],t:'Time of Check: privilege is validated and granted.'},
{n:[1],t:'In the narrow window, attacker swaps the object or exploits the flaw.'},
{n:[2],t:'Time of Use: the stale permission is applied to the wrong state. Detection needs logs correlated to a trusted time server.'}],d:'Atomic check-and-use, locking, trusted reference clock.'},
{name:'Plugin / DLL substitution',nodes:['Drive-by download','Fake DLL / PAM / auth plugin','Trusted path','System'],steps:[
{n:[0,1],t:'Unmanaged systems accept corrupted .dll, PAM modules or Mac authorization plugins.'},
{n:[1,2],t:'The substitute code replaces trustworthy code.'},
{n:[2,3],t:'The security kernel and reference monitor trusted path is broken; the attacker owns the system.'}],d:'Code signing, secure boot, managed and monitored systems.'}]}
],
gloss:[['IAAA','Identification, Authentication, Authorization, Accounting','Four linked processes that decide who you are, prove it, set what you may do, and record it'],
['IDaaS','Identity as a Service','Cloud-subscription identity and access management'],['IAM','Identity and Access Management','Policies and tools for digital identities and permissions'],
['SSO','Single Sign-On','One login for many applications'],['CSP','Cloud Service Provider','Company hosting your data or services'],['SLA','Service-Level Agreement','Contract defining service and security obligations'],
['MFA','Multi-Factor Authentication','Two or more proofs of identity'],['SAML','Security Assertion Markup Language','XML standard for SSO assertions'],['OIDC','OpenID Connect','Identity layer on OAuth 2.0 for SSO'],
['SCIM','System for Cross-domain Identity Management','Standard for automatic provisioning'],['ACL','Access Control List','Per-object list of who may do what'],
['RBAC','Role-Based Access Control','Permissions assigned through roles'],['DAC / MAC','Discretionary / Mandatory Access Control','Owner decides vs. system-enforced labels'],
['TCB','Trusted Computing Base','All components that must be trusted for security'],['RM','Reference Monitor','Abstract machine mediating all access'],
['TPM','Trusted Platform Module','Hardware chip for keys and crypto'],['BIOS / UEFI','Basic Input/Output System / Unified Extensible Firmware Interface','Firmware that boots the machine'],
['SRM','Security Reference Monitor','Windows kernel access-check component'],['LSM','Linux Security Modules','Kernel framework hosting SELinux, AppArmor'],
['SELinux','Security-Enhanced Linux','Mandatory access control for Linux'],['SAF','System Authorization Facility','z/OS security interface'],['RACF','Resource Access Control Facility','IBM mainframe access manager'],
['XNU','X is Not Unix','Apple’s macOS kernel'],['SIP','System Integrity Protection','macOS protection of system files'],['DEP','Data Execution Prevention','Blocks code running from data memory'],
['ASLR','Address Space Layout Randomization','Randomises memory layout'],['IDOR','Insecure Direct Object Reference','Changing an ID to reach others’ data'],
['API','Application Programming Interface','Programmatic service access'],['TOCTOU','Time of Check v. Time of Use','Race between check and use'],
['MITM','Machine-in-the-Middle','Interceptor between two parties'],['DLL','Dynamic-Link Library','Windows shared code module'],['PAM','Pluggable Authentication Modules','Unix/Linux auth plugins'],
['pwned','Pronounced “pawned”','Identity whose ownership was taken over'],['Multics','Multiplexed Information and Computing Service','1960s–70s OS pioneering security kernels']]};
if(typeof module!=='undefined')module.exports=D;

const $=(s,e=document)=>e.querySelector(s),H=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const ul=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const nav=$('#nav'),main=$('#main');let timer;
D.topics.concat([{id:'gl',name:'Glossary',title:'Terminology: full forms'}]).forEach((t,i)=>{const b=H('button','',t.name);b.setAttribute('role','tab');b.onclick=()=>show(t);b.id='t'+t.id;nav.append(b)});
function player(box,nodes,steps){let i=0;const f=H('div','flow'),st=H('div','step'),c=H('div','ctl');
nodes.forEach((n,k)=>{if(k)f.append(H('span','arrow','›'));f.append(H('div','node',n))});
const prev=H('button','btn','Back'),next=H('button','btn p','Next'),auto=H('button','btn','Auto-play');
function r(){f.querySelectorAll('.node').forEach((e,k)=>e.classList.toggle('on',steps[i].n.includes(k)));st.innerHTML='<b>Step '+(i+1)+' of '+steps.length+'.</b> '+steps[i].t}
next.onclick=()=>{i=(i+1)%steps.length;r()};prev.onclick=()=>{i=(i-1+steps.length)%steps.length;r()};
auto.onclick=()=>{clearInterval(timer);timer=setInterval(()=>{i=(i+1)%steps.length;r()},2600)};
c.append(prev,next,auto);box.append(f,st,c);r()}
function rm(box,steps){const R={grades:{staff:'read,write',student:'read',admin:'read,write,delete',unknown:''},notice:{staff:'read,write',student:'read',admin:'read,write,delete',unknown:'read'},config:{staff:'',student:'',admin:'read,write',unknown:''}};
const N={grades:'Grades database',notice:'Public notice board',config:'Server config'},S={staff:'Staff (Alice)',student:'Student (Bob)',admin:'Admin (Carol)',unknown:'Unknown process'};
const sel=(id,l,o)=>`<label>${l}<select id="${id}">${Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`;
box.innerHTML=`<div class="ctl">${sel('s','Subject',S)}${sel('o','Object',N)}${sel('a','Action',{read:'read',write:'write',delete:'delete'})}<label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="by">Bypass monitor (flawed design)</label><button class="btn p" id="run">Run request</button></div>
<div class="sim"><div class="box" id="b0">Subject<br><small>active, initiates</small></div><div class="box rm" id="b1">Reference<br>Monitor</div><div class="box" id="b2">Object<br><small>passive, on server</small></div><div class="box" id="b3">Rule base<br><small>written by owner</small></div><div class="box" id="b4">Logs<br><small>every attempt</small></div><div class="box" id="b5">Owner<br><small>defines the rules</small></div></div>
<div class="msg" id="m" aria-live="polite">Choose a request and press Run.</div><b>Audit log</b><div id="log"></div>`;
const q=x=>$('#'+x,box),on=a=>{for(let i=0;i<6;i++)q('b'+i).classList.toggle('on',a.includes(i))};
q('run').onclick=()=>{const s=q('s').value,o=q('o').value,a=q('a').value,by=q('by').checked,al=R[o][s]||'',ok=al.split(',').includes(a),m=q('m');let seq;
const L=x=>q('log').prepend(H('div','',new Date().toLocaleTimeString()+' – '+x));
if(by)seq=[[[0],`${S[s]} sends “${a} ${N[o]}”.`],[[2],'<span class="no">Request reaches the object directly. Nobody checked it: mediation is not complete.</span>'],[[4],'Nothing was logged. This is why the monitor must be unavoidable.']];
else seq=[[[0],`<b>${steps[0].t}</b> ${S[s]} wants to ${a} ${N[o]}.`],[[1],steps[1].t],[[1,3,5],`Rule base (set by owner): ${S[s]} on ${N[o]} may: <code>${al||'nothing'}</code>`],[[1],'Decision: '+(ok?'<span class="ok">PERMIT</span>':'<span class="no">DENY</span>')+` (${a} ${ok?'is':'is not'} in the allowed list)`],[ok?[2]:[1],ok?'Subject is granted access to the object.':'Denied. The object is never touched.'],[[4],'Logged: '+S[s]+' / '+a+' / '+N[o]+' / '+(ok?'PERMIT':'DENY')]];
seq.forEach(([n,t],i)=>setTimeout(()=>{on(n);m.innerHTML=t;if(i==seq.length-1)L(by?'(no entry, access bypassed)':`${S[s]} ${a} ${N[o]} → ${ok?'PERMIT':'DENY'}`)},i*1300))}}
function atk(box,t){const ch=H('div','flow'),pl=H('div'),dm=H('div','card');box.append(ch,pl);
t.items.forEach((it,i)=>{const b=H('button','chip',it.name);b.onclick=()=>pick(i);ch.append(b)});
function pick(i){clearInterval(timer);[...ch.children].forEach((b,k)=>b.setAttribute('aria-pressed',k==i));const it=t.items[i];pl.innerHTML='';player(pl,it.nodes,it.steps);pl.append(H('p','','<b>Defence:</b> '+it.d));if(it.name=='IDOR')idor(pl)}
pick(0)}
function idor(p){const c=H('div','card');c.innerHTML=`<b>Live IDOR demo.</b> You are logged in as account 1. Edit the account ID.<div class="ctl" style="margin:8px 0"><code>/profile?accountId=</code><select id="id"><option>1</option><option>2</option><option>3</option></select><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="ck">Server checks ownership</label></div><div class="msg" id="r"></div>`;p.append(c);
const f=()=>{const id=$('#id',c).value,ck=$('#ck',c).checked;$('#r',c).innerHTML=id==1?'<span class="ok">200</span> Your own data.':ck?'<span class="no">403 Forbidden</span> Ownership check failed.':'<span class="no">200 DATA LEAK</span> Account '+id+' returned with no authorization check.'};c.onchange=f;f()}
function gl(box){const i=H('input');i.type='search';i.placeholder='Filter terms';i.setAttribute('aria-label','Filter terms');const w=H('div','tw');box.append(i,w);
const r=()=>{const q=i.value.toLowerCase();w.innerHTML='<table><tr><th>Abbreviation</th><th>Full form</th><th>Meaning</th></tr>'+D.gloss.filter(g=>g.join(' ').toLowerCase().includes(q)).map(g=>'<tr><td><b>'+g[0]+'</b></td><td>'+g[1]+'</td><td>'+g[2]+'</td></tr>').join('')+'</table>'};i.oninput=r;r()}
function show(t){clearInterval(timer);[...nav.children].forEach(b=>b.setAttribute('aria-selected',b.id=='t'+t.id));main.innerHTML='';main.append(H('h2','',t.title));
if(t.id=='gl'){gl(main);return}
main.append(H('p','',t.intro));const sim=H('div','card');main.append(H('h3','','Working principle, step by step'),sim);
if(t.custom=='rm')rm(sim,t.steps);else if(t.custom=='atk')atk(sim,t);else player(sim,t.nodes,t.steps);
if(t.props)main.append(H('h3','','Three required properties'),(()=>{const d=H('div','cols');t.props.forEach(p=>d.append(H('div','card',`<b>${p[0]}</b><br>${p[1]}`)));return d})());
if(t.table)main.append(H('h3','','Implementation by platform'),H('div','tw card','<table><tr>'+t.table.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+t.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table>'));
const pc=H('div','cols');pc.append(H('div','card pro','<b>'+(t.plabel||'Pros')+'</b>'+ul(t.pros)),H('div','card con','<b>'+(t.clabel||'Cons')+'</b>'+ul(t.cons)));main.append(pc);
main.append(H('h3','','Where it is deployed'));const ap=H('div','cols');for(const k in t.apps)ap.append(H('div','card app','<b>'+k+'</b><br>'+t.apps[k]));main.append(ap)}
show(D.topics[1]);
</script></body></html>
