const G=[["ADFS","Active Directory Federation Services","Microsoft’s federated identity product that sits on top of AD and issues tokens."],["FIM","Federated Identity Management","Sharing identity and authentication across different security domains or organizations."],["SSO","Single Sign-On","Log in once, access many apps without retyping credentials."],["STS","Security Token Service","The ADFS component that issues signed security tokens."],["AD","Active Directory","Microsoft directory holding user accounts, groups and passwords."],["AD DS","Active Directory Domain Services","The AD role that stores and authenticates users in a domain."],["IdP","Identity Provider","The system that authenticates users and vouches for them (ADFS in these demos)."],["RP","Relying Party","The app that relies on the IdP’s token instead of checking passwords itself."],["Claim","Key/value fact about a user","Example: group = Finance. Used for authentication and authorization decisions."],["Token","Security token","Digitally signed package of claims that the app verifies."],["SAML","Security Assertion Markup Language","XML-based standard for token exchange between IdP and app."],["JWT","JSON Web Token","Compact JSON token format, used with OAuth/OpenID Connect."],["OAuth / OIDC","Open Authorization / OpenID Connect","Modern protocols for delegated access and sign-in, supported by newer ADFS."],["WS-Fed","Web Services Federation","Microsoft/OASIS federation protocol used by ADFS and Office 365."],["LDAP","Lightweight Directory Access Protocol","Protocol for querying directories such as AD."],["Kerberos","(Network authentication protocol)","Ticket-based protocol AD uses for domain logins, enables seamless sign-in."],["UPN","User Principal Name","User’s login in email style, e.g. alex@contoso.com."],["HRD","Home Realm Discovery","Working out which organization a user belongs to so they can be sent to the right IdP."],["MFA","Multi-Factor Authentication","Extra proof (code, app approval) on top of a password."],["B2B","Business-to-Business","Collaboration between separate organizations, e.g. federated partners."],["SaaS","Software as a Service","Cloud apps you use over the web, e.g. Salesforce."],["O365","Office 365 (now Microsoft 365)","Microsoft cloud productivity suite that can be federated with ADFS."],["Account partner","Organization that holds the users","The IdP side of a federation (Fabrikam)."],["Resource partner","Organization that holds the apps","The relying side that trusts the account partner (Contoso)."]];
$("gloss").innerHTML='<div class="card sum"><b>Summary in one paragraph.</b> <b>ADFS</b> (Active Directory Federation Services) is Microsoft’s implementation of <b>FIM</b> (Federated Identity Management). Its <b>STS</b> (Security Token Service) checks users against <b>AD</b> and issues signed tokens full of <b>claims</b>. Apps trust the token, which gives users <b>SSO</b> (Single Sign-On) and lets partner organizations share access securely (<b>B2B</b>), including to cloud services like <b>O365</b>, Azure and <b>SaaS</b>.</div><div class="card" style="overflow-x:auto"><table class="gt"><tr><th>Term</th><th>Full form</th><th>Meaning</th></tr>'+G.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+'</table></div>';
const WP=[["Establish trust (one-time setup)","Admins exchange federation metadata and signing certificates between ADFS and each app or partner (relying party trust / claims provider trust). Claim rules are defined.","Passwords never need to be shared; trust is configured once and reused.","Certificate expiry or misconfigured metadata breaks sign-in for everyone."],["User requests a protected app","The user opens the app. The app (relying party) finds no valid session.","Apps need no password database of their own.","Every app must be integrated and registered with ADFS."],["Redirect to the STS","The app redirects the browser to ADFS with an authentication request (SAML, WS-Federation or OIDC/OAuth).","Standard protocols work with many vendors.","Redirect loops or clock skew between servers cause hard-to-debug errors."],["Authenticate against AD","ADFS checks the credentials in Active Directory, using forms, Windows integrated (Kerberos), smart card/certificate or MFA.","Reuses existing AD accounts, groups and policies. Strong methods such as MFA can be enforced centrally.","If AD or ADFS is down, nobody can log in (single point of failure unless made highly available)."],["Collect attributes and apply claim rules","ADFS reads attributes (groups, email, UPN) from AD and transforms them into claims, filtering what each app may see.","Fine-grained, policy-driven access and data minimization.","Complex rule sets are difficult to maintain and test."],["STS issues a signed token","The Security Token Service packages claims into a SAML or JWT token and signs it with its private key.","Tamper-evident token; the app can verify the origin without calling AD.","A stolen valid token can be replayed until it expires, so lifetimes must be short."],["App validates the token and authorizes","The app checks the signature, audience and expiry, then grants or denies access by claims (e.g. group = Finance).","Consistent authorization across internal, external, cloud and mobile apps.","App owners must map claims to roles correctly."],["Session reuse gives SSO","ADFS keeps an authenticated session, so the next app gets a new token without another prompt. Federated partners follow the same flow through their own STS.","Fewer passwords, less help-desk load, better user experience.","One compromised session can open many apps, so use MFA and sign-out policies."]];
const PRO=["One login for many apps improves productivity and user experience","Re-uses existing AD users and groups, so no second directory is needed","Passwords stay inside the home domain; apps only see signed claims","Trust-based B2B access with no duplicate accounts for partners","Central policy, MFA and auditing in one place","Bridges on-premises AD with Microsoft 365, Azure and SaaS","Fewer password resets lowers help-desk cost","Control stays on-premises (useful where data or compliance rules require it)"];
const CON=["Needs its own infrastructure: ADFS farm, Web Application Proxy, load balancers, certificates","Single point of failure unless deployed highly available","Certificate and metadata management is an ongoing burden","Claim rules and federation trusts can become complex","Higher operational cost than cloud identity services","Microsoft now recommends Microsoft Entra ID for new cloud-first deployments, so ADFS is mostly for existing or on-premises-driven needs","Compromise of the STS signing key affects every trusting app"];
const DOM=[["🏢 Commercial / enterprise",["Large companies giving staff one login to Microsoft 365, Azure, SaaS (Salesforce, ServiceNow, Workday style apps) and internal portals","Mergers and acquisitions: connect two directories quickly without merging them","Supplier and partner extranets (B2B)"]],["🛡️ Defense & public safety",["Defense and government networks commonly pair federation with smart-card (PKI) authentication, such as the US Common Access Card, so a hardware-backed login yields tokens for many systems","Coalition information sharing: allied nations keep their own identity systems and trust each other’s tokens, the model behind NATO’s Federated Mission Networking concept","Strict, claim-based clearance and role checks, and on-premises control for sensitive data"]],["🏛️ Government",["Citizen and employee portals; agencies sharing services without sharing user databases","Cross-agency collaboration under audited trust agreements"]],["🎓 Education & research",["Universities giving students and staff one login to campus systems and partner services","Inter-university federations (SAML-based, for example InCommon in the US) so researchers can use other institutions’ resources"]],["🏥 Healthcare",["Clinicians reach electronic records, labs and imaging with one secure login","Claims limit data to the user’s role, supporting privacy rules such as HIPAA"]],["🏦 Finance & insurance",["Staff SSO with MFA across trading, CRM and compliance apps","Secure agent, broker and auditor access via federation"]],["🏭 Manufacturing, retail & logistics",["Supply-chain portals for vendors and distributors","Mobile workers using managed devices to reach inventory and HR apps"]],["☁️ Cloud & mobile",["Hybrid identity for Microsoft 365 and Azure","Same policies on laptop, browser or phone through Web Application Proxy"]]];
$("info").innerHTML='<div class="card sum"><b>Working principle in one line:</b> instead of every app checking passwords itself, apps <b>trust one identity authority</b> (the ADFS STS). The user proves identity once to that authority, which hands back a <b>signed token of claims</b> that any trusting app can verify.</div><h2 class="ph">🔄 Working principle, step by step (with pros &amp; watch-outs)</h2><div class="ws">'+WP.map((w,i)=>`<div class="card"><h3>${i+1} · ${w[0]}</h3><p>${w[1]}</p><p class="pro">✅ ${w[2]}</p><p class="con">⚠️ ${w[3]}</p></div>`).join("")+'</div><h2 class="ph">⚖️ Overall pros and cons</h2><div class="pc"><div class="card"><b class="pro">✅ Advantages</b><ul>'+PRO.map(x=>`<li>${x}</li>`).join("")+'</ul></div><div class="card"><b class="con">⚠️ Limitations</b><ul>'+CON.map(x=>`<li>${x}</li>`).join("")+'</ul></div></div><h2 class="ph">🌍 Where it is deployed and working</h2><div class="ws">'+DOM.map(d=>`<div class="card dom"><h3>${d[0]}</h3><ul>${d[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")+'</div><p class="sub" style="margin-top:12px">Examples describe common deployment patterns, not specific named customers. Check each vendor’s current documentation before designing a real system.</p>';
show("concepts");
</script></body></html>
